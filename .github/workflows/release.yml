name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: 10.0.x }
      - name: Run scan tests
        run: dotnet run --project tests/ScanEngineTests.csproj -c Release --nologo
      - name: Publish self-contained executable
        run: dotnet publish OpenSpace.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o release\OpenSpace --nologo
      - name: Verify packaged executable launch
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'release\OpenSpace\OpenSpace.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'OpenSpace.exe missing from package output.' }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Milliseconds 1500
          $process.Refresh()
          if ($process.HasExited) { throw "Packaged OpenSpace exited with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force
      - name: Add documentation
        shell: pwsh
        run: Copy-Item README.md,LICENSE release\OpenSpace
      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path release\OpenSpace\* -DestinationPath OpenSpace-${{ github.ref_name }}-win-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: OpenSpace-${{ github.ref_name }}-win-x64.zip
